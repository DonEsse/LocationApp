<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalizaçãoLemar</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2196f3" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <button id="toggle-tema">🌙</button>
  <h1>Gerenciador de Localização</h1>

  <!-- Formulário fica escondido no modo técnico -->
  <form id="form">
    <input type="text" id="cliente" placeholder="Nome do cliente" required />
    <input type="text" id="os" placeholder="Número da OS" required />
    <input type="text" id="localizacao" placeholder="Link da localização" required />
    <button type="submit">Enviar</button>
  </form>

  <div class="lista">
    <input type="text" id="busca" class="search" placeholder="Buscar por cliente ou OS" />
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>OS</th>
          <th>Localização</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>
  <script type="module" src="js/script.js"></script>
  <script type="module" src="js/tema.js"></script>
</body>
</html>

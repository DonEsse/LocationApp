<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área do Técnico</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <button id="toggle-tema" aria-label="Alternar tema">🌙</button>
  <h1>Área do Técnico</h1>

  <div class="top-bar">
    <button id="logout">Sair</button>
  </div>

  <section id="tecnico-section">
    <h2>Localizações Salvas</h2>

    <input
      type="search"
      id="busca"
      placeholder="Buscar por cliente ou OS"
      aria-label="Buscar por cliente ou OS"
    />

    <!-- Indicador de carregamento -->
    <div id="loading" style="display:none;" role="alert">Carregando dados...</div>

    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>OS</th>
          <th>Localização</th>
        </tr>
      </thead>
      <tbody id="tabela" aria-live="polite"></tbody>
    </table>

    <!-- Contador de registros -->
    <p id="contador" style="margin-top: 10px; font-weight: bold;"></p>

    <!-- Botão "Carregar mais" -->
    <button
      id="carregarMaisBtn"
      style="display: none; padding: 10px 20px; margin-top: 10px; cursor: pointer;"
    >
      Carregar mais
    </button>
  </section>

  <script type="module" src="js/tecnico.js"></script>
  <script type="module" src="js/tema.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css" />

  <!-- Manifesto PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2196f3" />
</head>
<body>
  <button id="toggle-tema">🌙</button>
  <h1>Login</h1>
  <form id="login-form" autocomplete="off">
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Email" required autocomplete="username" />
    
    <label for="senha">Senha:</label>
    <input type="password" id="senha" placeholder="Senha" required autocomplete="current-password" />
    
    <button type="submit">Entrar</button>
  </form>

  <p id="mensagem" aria-live="polite"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfg_lRG34ys48oC0c656z8nD3RMSuG_7s",
      authDomain: "locationapplemar.firebaseapp.com",
      databaseURL: "https://locationapplemar-default-rtdb.firebaseio.com",
      projectId: "locationapplemar",
      storageBucket: "locationapplemar.appspot.com",
      messagingSenderId: "934968303323",
      appId: "1:934968303323:web:3799b63439697a88b776fe",
      measurementId: "G-Q3CP9QCQYY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const form = document.getElementById('login-form');
    const mensagem = document.getElementById('mensagem');
    const botao = form.querySelector('button');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      botao.disabled = true;
      mensagem.textContent = "";
      mensagem.style.color = "";

      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
        const userCred = await signInWithEmailAndPassword(auth, email, senha);
        const uid = userCred.user.uid;

        const snapshot = await get(ref(db, 'usuarios/' + uid));
        const dados = snapshot.val();

        if (!dados || !dados.role) {
          mensagem.textContent = "Usuário sem função definida.";
          mensagem.style.color = "red";
          await auth.signOut();
          botao.disabled = false;
          return;
        }

        if (dados.role === "admin") {
          window.location.href = "admin.html";
        } else if (dados.role === "tecnico") {
          window.location.href = "tecnico.html";
        } else {
          mensagem.textContent = "Função inválida.";
          mensagem.style.color = "red";
          await auth.signOut();
        }
      } catch (error) {
        mensagem.textContent = "Erro ao fazer login: " + error.message;
        mensagem.style.color = "red";
        botao.disabled = false;
      }
    });
  </script>
  <script type="module" src="js/tema.js"></script>
  <!-- ✅ Registro do Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('✅ Service Worker registrado:', reg.scope))
          .catch(err => console.error('❌ Erro no Service Worker:', err));
      });
    }
  </script>
</body>
</html>

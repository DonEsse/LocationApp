<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área do Administrador</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .menu-hamburguer {
      cursor: pointer;
      font-size: 1.5em;
      user-select: none;
      padding: 0.5em;
      border: 1px solid #ccc;
      width: fit-content;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <button id="toggle-tema" aria-label="Alternar tema">🌙</button>
  <h1>Área do Administrador</h1>

  <div id="conteudo" style="display: none;">
    <div class="menu-hamburguer" id="toggle-admin-section">☰ Cadastrar Técnico</div>

    <section id="admin-section">
      <h2>Cadastro de Técnico</h2>
      <form id="registro-tecnico-form">
        <label for="nome-tecnico">Nome do Técnico:</label>
        <input type="text" id="nome-tecnico" required />

        <label for="email-tecnico">Email:</label>
        <input type="email" id="email-tecnico" required />

        <label for="senha-tecnico">Senha:</label>
        <input type="password" id="senha-tecnico" required />

        <input type="hidden" id="role-tecnico" value="tecnico" />

        <button type="submit">Salvar</button>
      </form>
      <p id="msg-registro"></p>
    </section>

    <section id="tecnico-section">
      <h2>Gerenciador de Localizações</h2>
      <form id="form" autocomplete="off">
        <label for="cliente">Nome do cliente:</label>
        <input type="text" id="cliente" required />

        <label for="conta">Conta do cliente:</label>
        <input type="text" id="conta" required /> 
        
        <label for="os">Número da OS:</label>
        <input type="text" id="os" required />

        <label for="localizacao">Link da localização:</label>
        <input type="url" id="localizacao" required />

        <button type="submit">Enviar</button>
      </form>

      <input type="search" id="busca" placeholder="Buscar por Cliente, Conta ou OS" />

      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Conta</th>
            <th>OS</th>
            <th>Localização</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela"></tbody>
      </table>

      <p id="contador" style="margin-top: 10px; font-weight: bold;"></p>

      <button id="carregar-mais">Carregar mais</button>
    </section>

    <button id="logout">Sair</button>
  </div>

  <script type="module" src="js/admin.js"></script>
  <script type="module" src="js/tema.js"></script>
</body>
</html>
